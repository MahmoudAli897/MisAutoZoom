<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' file: data:;">
    <title>ZoomTransform</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <header class="app-header">
            <h1>ZoomTransform</h1>
            <span class="subtitle">Interactive zoom animation via the Transform effect</span>
        </header>

        <section class="canvas-section">
            <div class="canvas-toolbar">
                <button id="btn-reframe" class="btn btn-primary" title="Capture the current frame and show it on the canvas">
                    ReFrame
                </button>
                <button id="btn-clear" class="btn btn-ghost" title="Clear the rectangle">
                    Clear
                </button>
                <button id="btn-diagnose" class="btn btn-ghost" title="Run a diagnostic and show the report">
                    Diagnose
                </button>
                <label class="toggle">
                    <input type="checkbox" id="toggle-grid" checked>
                    <span>Grid</span>
                </label>
            </div>
            <div class="canvas-wrap" id="canvas-wrap">
                <canvas id="canvas" width="380" height="240"></canvas>
                <div class="canvas-hint" id="canvas-hint">Press ReFrame to show the frame, then drag to draw the zoom rectangle</div>
            </div>
        </section>

        <section class="controls">
            <div class="control-row">
                <label for="max-zoom">Max Zoom (%)</label>
                <input type="number" id="max-zoom" min="100" max="1000" step="10" value="600">
            </div>
            <div class="control-row">
                <label for="duration">Transition duration (s)</label>
                <input type="range" id="duration" min="0" max="5" step="0.1" value="0.8">
                <span class="val-readout" id="duration-val">0.8</span>
            </div>
            <div class="control-row">
                <label for="easing">Easing</label>
                <select id="easing">
                    <option value="linear">Linear</option>
                    <option value="easeIn">Ease In</option>
                    <option value="easeOut">Ease Out</option>
                    <option value="easeInOut" selected>Ease InOut</option>
                </select>
            </div>
            <div class="control-row checkboxes">
                <label class="toggle"><input type="checkbox" id="motion-blur"> <span>Motion Blur</span></label>
                <label class="toggle"><input type="checkbox" id="create-keyframes" checked> <span>Create Keyframes</span></label>
                <label class="toggle"><input type="checkbox" id="lock-center" checked> <span>Lock Zoom Center</span></label>
            </div>
        </section>

        <section class="readout">
            <div class="readout-item"><span>Zoom:</span><b id="ro-zoom">100%</b></div>
            <div class="readout-item"><span>Position:</span><b id="ro-pos">&mdash;</b></div>
            <div class="readout-item"><span>Size:</span><b id="ro-size">&mdash;</b></div>
            <div class="readout-item"><span>Rotation:</span><b id="ro-rot">0&deg;</b></div>
        </section>

        <footer class="actions">
            <button id="btn-apply" class="btn btn-accent" disabled>Apply Transform</button>
        </footer>

        <pre id="diag-report" class="diag-report" hidden></pre>
        <div id="status" class="status"></div>
    </div>

    <script src="lib/CSInterface.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
