<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' file: data:;">
    <title>ZoomTransform</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <header class="app-header">
            <h1>ZoomTransform</h1>
            <span class="subtitle">تأثير الترانسفورم مع زوم تفاعلي</span>
        </header>

        <section class="canvas-section">
            <div class="canvas-toolbar">
                <button id="btn-reframe" class="btn btn-primary" title="التقاط اللقطة الحالية وعرضها في الكانفس">
                    ⟳ ReFrame
                </button>
                <button id="btn-clear" class="btn btn-ghost" title="مسح المستطيل">
                    مسح
                </button>
                <label class="toggle">
                    <input type="checkbox" id="toggle-grid" checked>
                    <span>الشبكة</span>
                </label>
            </div>
            <div class="canvas-wrap" id="canvas-wrap">
                <canvas id="canvas" width="380" height="240"></canvas>
                <div class="canvas-hint" id="canvas-hint">اضغط ReFrame لعرض اللقطة، ثم اسحب لرسم مستطيل الزوم</div>
            </div>
        </section>

        <section class="controls">
            <div class="control-row">
                <label for="max-zoom">أقصى زوم (%)</label>
                <input type="number" id="max-zoom" min="100" max="1000" step="10" value="600">
            </div>
            <div class="control-row">
                <label for="duration">مدة الأنيمشن (ثانية)</label>
                <input type="range" id="duration" min="0" max="5" step="0.1" value="1.5">
                <span class="val-readout" id="duration-val">1.5</span>
            </div>
            <div class="control-row">
                <label for="easing">نوع الحركة</label>
                <select id="easing">
                    <option value="linear">خطي Linear</option>
                    <option value="easeIn">تسارع Ease In</option>
                    <option value="easeOut">تباطؤ Ease Out</option>
                    <option value="easeInOut" selected>تسارع وتباطؤ Ease InOut</option>
                </select>
            </div>
            <div class="control-row checkboxes">
                <label class="toggle"><input type="checkbox" id="motion-blur"> <span>ضبابية الحركة</span></label>
                <label class="toggle"><input type="checkbox" id="create-keyframes" checked> <span>إنشاء Keyframes</span></label>
                <label class="toggle"><input type="checkbox" id="lock-center" checked> <span>تثبيت مركز الزوم</span></label>
            </div>
        </section>

        <section class="readout">
            <div class="readout-item"><span>الزوم:</span><b id="ro-zoom">100%</b></div>
            <div class="readout-item"><span>الموضع:</span><b id="ro-pos">—</b></div>
            <div class="readout-item"><span>الحجم:</span><b id="ro-size">—</b></div>
            <div class="readout-item"><span>الدوران:</span><b id="ro-rot">0°</b></div>
        </section>

        <footer class="actions">
            <button id="btn-apply" class="btn btn-accent" disabled>تطبيق الترانسفورم</button>
        </footer>

        <div id="status" class="status"></div>
    </div>

    <script src="lib/CSInterface.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
